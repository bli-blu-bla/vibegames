name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Quality Gate (Biome, Checks, Vitest, Build)
        run: npm run gate
      - name: Smoke-Test (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
